<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">CoAP and MQTT test bench</title>
  <desc id="d">Two Ubuntu virtual machines on QEMU/KVM. The device VM runs coap-client and mosquitto_pub. The application VM at 192.168.122.30 runs a custom CoAP server with a /test resource, the MQTT broker side (mosquitto_sub) and Wireshark. Packet loss of 0, 3, 5 and 10 percent is added on the access side. Below, the messages seen in Wireshark for each mode: CoAP confirmable is CON GET then ACK 2.05; CoAP non-confirmable is NON GET then a 2.05 reply; MQTT QoS 0 is one PUBLISH; QoS 1 is PUBLISH then PUBACK; QoS 2 is PUBLISH, PUBREC, PUBREL, PUBCOMP. Average latency over 30 transactions rises from 0.24 to 0.34 ms for CoAP confirmable, 0.14 to 0.15 ms for non-confirmable, 0.26 to 0.27 ms for QoS 0, 0.31 to 0.97 ms for QoS 1 and 0.47 to 1.88 ms for QoS 2 as loss goes from 0 to 10 percent.</desc>
  <style>
    :root { --ink:#1f2937; --sub:#57606a; --line:#d0d7de; --card:#ffffff; --on:#0e7490; --tint:#ecfeff; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --card:#161b22; --on:#22d3ee; --tint:#083344; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .lane  { font-size:12px; font-weight:700; fill:var(--sub); letter-spacing:.06em; }
    .title { font-size:14px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .sub   { font-size:11px; fill:var(--sub); text-anchor:middle; }
    .row   { font-size:12.5px; font-weight:700; fill:var(--ink); }
    .chip-t{ font-size:11px; font-weight:600; fill:var(--ink); text-anchor:middle; }
    .lat   { font-size:12px; font-weight:600; fill:var(--on); text-anchor:end; }
    .node  { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .db    { fill:var(--tint); stroke:var(--on); stroke-width:1.5; }
    .chip  { fill:var(--card); stroke:var(--line); stroke-width:1.2; }
    .wire  { stroke:var(--line); stroke-width:1.5; fill:none; }
    .flow  { stroke:var(--on); stroke-width:2; fill:none; stroke-dasharray:3 11; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-14; } }
    .head  { fill:var(--line); }
    .dot   { fill:var(--on); }
    .t1 { animation: go 4s infinite ease-in-out; }
    @keyframes go { 0%,8% { transform:translateX(250px); } 46%,54% { transform:translateX(710px); } 92%,100% { transform:translateX(250px); } }
    /* QoS 2 handshake: highlight the four steps in order */
    .q1 { animation: k1 6s infinite; } .q2 { animation: k2 6s infinite; }
    .q3 { animation: k3 6s infinite; } .q4 { animation: k4 6s infinite; }
    @keyframes k1 { 0%,22% { stroke:var(--on); fill:var(--tint); } 25%,100% { stroke:var(--line); fill:var(--card); } }
    @keyframes k2 { 0%,25% { stroke:var(--line); fill:var(--card); } 27%,47% { stroke:var(--on); fill:var(--tint); } 50%,100% { stroke:var(--line); fill:var(--card); } }
    @keyframes k3 { 0%,50% { stroke:var(--line); fill:var(--card); } 52%,72% { stroke:var(--on); fill:var(--tint); } 75%,100% { stroke:var(--line); fill:var(--card); } }
    @keyframes k4 { 0%,75% { stroke:var(--line); fill:var(--card); } 77%,97% { stroke:var(--on); fill:var(--tint); } 100% { stroke:var(--line); fill:var(--card); } }
    @media (prefers-reduced-motion: reduce) { .flow, .t1, .q1, .q2, .q3, .q4 { animation:none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
  </defs>

  <!-- Test bench -->
  <text class="lane" x="20" y="24">TEST BENCH  (two Ubuntu VMs on QEMU/KVM)</text>
  <rect class="node" x="20" y="38" width="230" height="96" rx="12"/>
  <text class="title" x="135" y="66">Device VM</text>
  <text class="sub" x="135" y="86">Ubuntu 24.04</text>
  <text class="sub" x="135" y="104">coap-client · mosquitto_pub</text>
  <text class="sub" x="135" y="120">topic test/sensor</text>

  <rect class="node" x="710" y="38" width="230" height="96" rx="12"/>
  <text class="title" x="825" y="66">Application VM</text>
  <text class="sub" x="825" y="86">192.168.122.30</text>
  <text class="sub" x="825" y="104">CoAP server /test · MQTT broker</text>
  <text class="sub" x="825" y="120">Wireshark capture</text>

  <path class="wire" d="M250 86 H400"/> <path class="flow" d="M250 86 H400"/>
  <path class="wire" d="M560 86 H708" marker-end="url(#a)"/> <path class="flow" d="M560 86 H700"/>
  <rect class="db" x="400" y="58" width="160" height="56" rx="10"/>
  <text class="title" x="480" y="82">Access-side loss</text>
  <text class="sub" x="480" y="100">0 · 3 · 5 · 10 %</text>
  <circle class="dot t1" cx="0" cy="86" r="5"/>

  <!-- Message sequences -->
  <text class="lane" x="20" y="174">MESSAGES SEEN IN WIRESHARK  (→ device to app, ← app to device)</text>
  <text class="lane" x="940" y="174" text-anchor="end">AVG ms, 0% → 10%</text>

  <g>
    <text class="row" x="20" y="208">CoAP confirmable</text>
    <rect class="chip" x="215" y="190" width="130" height="28" rx="10"/><text class="chip-t" x="280" y="208">CON GET /test →</text>
    <rect class="chip" x="355" y="190" width="130" height="28" rx="10"/><text class="chip-t" x="420" y="208">← ACK 2.05 "hello"</text>
    <text class="lat" x="940" y="208">0.24 → 0.34</text>

    <text class="row" x="20" y="248">CoAP non-confirmable</text>
    <rect class="chip" x="215" y="230" width="130" height="28" rx="10"/><text class="chip-t" x="280" y="248">NON GET /test →</text>
    <rect class="chip" x="355" y="230" width="130" height="28" rx="10"/><text class="chip-t" x="420" y="248">← 2.05 "hello"</text>
    <text class="lat" x="940" y="248">0.14 → 0.15</text>

    <text class="row" x="20" y="288">MQTT QoS 0  at most once</text>
    <rect class="chip" x="215" y="270" width="130" height="28" rx="10"/><text class="chip-t" x="280" y="288">PUBLISH →</text>
    <text class="lat" x="940" y="288">0.26 → 0.27</text>

    <text class="row" x="20" y="328">MQTT QoS 1  at least once</text>
    <rect class="chip" x="215" y="310" width="130" height="28" rx="10"/><text class="chip-t" x="280" y="328">PUBLISH →</text>
    <rect class="chip" x="355" y="310" width="130" height="28" rx="10"/><text class="chip-t" x="420" y="328">← PUBACK</text>
    <text class="lat" x="940" y="328">0.31 → 0.97</text>

    <text class="row" x="20" y="368">MQTT QoS 2  exactly once</text>
    <rect class="chip q1" x="215" y="350" width="130" height="28" rx="10"/><text class="chip-t" x="280" y="368">PUBLISH →</text>
    <rect class="chip q2" x="355" y="350" width="130" height="28" rx="10"/><text class="chip-t" x="420" y="368">← PUBREC</text>
    <rect class="chip q3" x="495" y="350" width="130" height="28" rx="10"/><text class="chip-t" x="560" y="368">PUBREL →</text>
    <rect class="chip q4" x="635" y="350" width="130" height="28" rx="10"/><text class="chip-t" x="700" y="368">← PUBCOMP</text>
    <text class="lat" x="940" y="368">0.47 → 1.88</text>
  </g>
  <text class="sub" x="480" y="406">Each latency is the average of 30 transactions, read from Wireshark timestamps. More round trips per message = more delay when packets are lost.</text>
</svg>
